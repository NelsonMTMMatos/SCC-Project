config:
  target: 'http://20.76.245.148:8080/scc2324-phase1-1.0/api'
  plugins:
    metrics-by-endpoint:
      useOnlyRequestNames: true
  processor: "./test-utils.js"
  phases:
    - name: "Serverless"
      duration: 60
      arrivalRate: 1               # set this value as high as possible for avoiding timeouts

scenarios:
  - name: 'User checks discounted houses until a certain date'
    weight: 5
    flow:
      - loop:
        - get:
            url: "/serverless/discounted?date=2025-01-01"
            name: "GET:/serverless/discounted"
            headers:
              Accept: application/json
        - get:
            url: "/serverless/houses/recent"
            name: "GET:/serverless/houses/recent"
            headers:
              Accept: application/json
        count: 10

