apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cache
  template:
    metadata:
      labels:
        app: redis-cache
    spec:
      nodeSelector:
        "beta.kubernetes.io/os": linux
      containers:
      - name: redis-cache
        image: mcr.microsoft.com/oss/bitnami/redis:6.0.8
        env:
        - name: ALLOW_EMPTY_PASSWORD
          value: "yes"
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 256Mi
        ports:
        - containerPort: 6379
          name: redis

---
apiVersion: v1
kind: Service
metadata:
  name: redis-cache
spec:
  ports:
  - port: 6379
  selector:
    app: redis-cache

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: application
  template:
    metadata:
      labels:
        app: application
    spec:
      nodeSelector:
        "beta.kubernetes.io/os": linux
      containers:
      - name: application
        image: renatoviola02/scc2324-app:latest
        resources:
          requests:
            cpu: 500m
            memory: 1024Mi
          limits:
            cpu: 500m
            memory: 1024Mi
        ports:
        - containerPort: 8080
        env:
        - name: REDIS_URL
          value: "redis-cache"
        - name: COSMOSDB_KEY
          value: "BmMTkbVnUReqzKhzQ4vvHKkU8Mhmkr9UDok9dKXkPp7kagmrRfONeZMrpKxOssi6lgT1YaLbyEgDACDbWV6kbQ=="
        - name: COSMOSDB_URL
          value: "https://scc2460665.documents.azure.com:443/"
        - name: COSMOSDB_DATABASE
          value: "scc24db60665"
        volumeMounts:
          - mountPath: "/mnt/vol"
            name: mediavolume
      volumes:
        - name: mediavolume
          persistentVolumeClaim:
            claimName: azure-managed-disk

---
apiVersion: v1
kind: Service
metadata:
  name: application
spec:
  type: LoadBalancer
  ports:
  - port: 8080
  selector:
    app: application

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: azure-managed-disk
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: azurefile
  resources:
    requests:
      storage: 1Gi
